      - object_identity
      - object_audit
      - object_title
  App\Notifying\Entity\NotificationRecipientEntity:
    table: notifying_notification_recipient
    effective_packs:
      - object_identity
      - object_audit
  App\Notifying\Entity\NotificationPreferenceEntity:
    table: notifying_notification_preference
    effective_packs:
      - object_identity
      - object_audit
      - object_title
  App\Notifying\Entity\NotificationSubscriptionEntity:
    table: notifying_notification_subscription
